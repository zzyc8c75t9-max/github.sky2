<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致敬信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #d0d0d0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            padding: 30px 16px 60px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景金色装饰丝带 */
        .bg-decor {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decor::before {
            content: '';
            position: absolute;
            top: -10%; right: -10%;
            width: 60%; height: 60%;
            border: 12px solid #d4af37;
            border-radius: 50%;
            transform: rotate(30deg);
            opacity: 0.3;
            filter: blur(2px);
        }
        .bg-decor::after {
            content: '';
            position: absolute;
            bottom: -20%; left: -10%;
            width: 70%; height: 70%;
            border: 16px solid #d4af37;
            border-radius: 50%;
            transform: rotate(-45deg);
            opacity: 0.25;
            filter: blur(4px);
        }

        .envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            z-index: 1;
        }

        /* ====== 信纸 ====== */
        .letter-paper {
            position: relative;
            z-index: 2;
            background: #ffffff;
            width: 86%;
            margin: 0 auto;
            padding: 0 15px 0 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }

        /* ====== 信纸头部（图片） ====== */
        .letter-header {
            position: relative;
            width: 100%;
            margin: 0 auto 0 auto;
            z-index: 3;
            line-height: 0;
        }
        .header-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0;
            box-shadow: none;
            -webkit-mask-image:
                linear-gradient(to bottom, transparent 0%, black 5%, black 75%, transparent 100%),
                linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image:
                linear-gradient(to bottom, transparent 0%, black 5%, black 75%, transparent 100%),
                linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            mask-composite: intersect;
        }

        /* ====== 信件内容（纯黄色实色边框） ====== */
        .letter-content {
            font-size: 17px;
            line-height: 2.0;
            color: #333;
            word-break: break-word;
            position: relative;
            z-index: 3;
            width: 100%;
            overflow: visible;
            border: 4px solid #ffd700;
            border-radius: 6px;
            padding: 20px 20px 150px 20px;
        }
        .paragraph {
            text-indent: 2em;
            margin: 0;
            color: #333;
            min-height: 1.2em;
        }
        .char {
            opacity: 0;
            animation: fadeIn 0.05s forwards;
            display: inline;
        }
        /* ★ 同色加粗 */
        .char.bold {
            color: #333;
            font-weight: 700;
        }
        .char.white {
            color: #333;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #ffd700;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ====== 信封底部 ====== */
        .envelope-bottom {
            position: relative;
            z-index: auto;
            margin-top: -80px;
            height: 220px;
            width: 100%;
            background: #c62828;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .envelope-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: #e53935;
            clip-path: polygon(0 0, 0 100%, 100% 100%);
            z-index: 3;
            border-bottom-left-radius: 12px;
        }
        .envelope-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: #e53935;
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
            z-index: 3;
            border-bottom-right-radius: 12px;
        }

        .envelope-flap {
            position: absolute;
            top: -60px;
            left: 0;
            width: 100%;
            height: 60px;
            background: #b71c1c;
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
            z-index: 1;
        }

        /* 圆形印章 */
        .envelope-seal {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: transparent;
            border: none;
            box-shadow: none;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .seal-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .seal-svg-fallback {
            width: 100%;
            height: 100%;
            display: none;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            body { padding: 20px 10px 40px 10px; }
            .letter-paper { padding: 0 12px 0 12px; }
            .letter-content { padding: 15px 15px 120px 15px; }
            .envelope-bottom { height: 180px; margin-top: -70px; }
            .envelope-flap { top: -50px; height: 50px; }
            .envelope-seal { width: 70px; height: 70px; bottom: 20px; }
            .letter-content { font-size: 16px; }
        }
        @media (max-width: 400px) {
            .letter-paper { padding: 0 10px 0 10px; }
            .letter-content { padding: 12px 12px 100px 12px; }
            .envelope-bottom { height: 150px; margin-top: -60px; }
            .envelope-flap { top: -40px; height: 40px; }
            .envelope-seal { width: 60px; height: 60px; bottom: 15px; }
            .letter-content { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="bg-decor"></div>

    <div class="envelope-wrapper">
        <!-- 信纸 -->
        <div class="letter-paper">
            <!-- ★★★ 头部直接用图片（将 header.png 替换为你的图1文件名） ★★★ -->
            <div class="letter-header">
                <img class="header-img" src="header.png" alt="致敬信头部">
            </div>
            <!-- 信件正文 -->
            <div class="letter-content" id="letterContent"></div>
        </div>

        <!-- 信封底部 -->
        <div class="envelope-bottom">
            <div class="envelope-flap"></div>
            <div class="envelope-left"></div>
            <div class="envelope-right"></div>

            <!-- 印章区域 -->
            <div class="envelope-seal">
                <img class="seal-img"
                     src="seal.png"
                     alt="印章"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <svg class="seal-svg-fallback" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#c62828" stroke-width="4" stroke-dasharray="10 5" />
                    <circle cx="50" cy="50" r="18" fill="#c62828" />
                    <path d="M 40 50 L 60 50 M 50 40 L 50 60" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                </svg>
            </div>
        </div>
    </div>

<script>
(function() {
    // ---------- 致敬信定稿全文（[[...]] 内为同色加粗字体） ----------
    const paragraphs = [
        // 标题
        { text: '致 敬 信', noIndent: true },
        // 称呼
        { text: '亲爱的员工朋友们：', noIndent: true },
        { text: '大家好！' },
        // 正文第一段
        { text: '秋酿启序，习酒飘香；实干笃行，华章日新。今天，我们召开2027年度生产·质量大会，系统总结过去一年的工作，共同壁画新一年的发展蓝图。在此，公司党委、经营班子向辛勤耕耘在生产、质量一线的员工致以亲切的问候，向默默奋进在各条工作战线上的全体员工表达最诚挚的感谢！' },
        // 正文第二段（含加粗短语）
        { text: '回望过去一年，挑战与机遇并存，压力与动力同在。全体习酒人承压前行、迎难而上，牢牢守住了发展基本盘，稳稳迈出高质量发展新步伐。[[党建引领强根基]]。坚持把党建引领贯穿企业发展全过程，将组织优势转化为精工艺、提品质、促创新的实干动能，让党旗在车间班组高高飘扬，让先锋在攻坚前沿熠熠生辉，为习酒行稳致远筑牢根本保障。[[匠心守正铸品质]]。传承千年酿造技艺，顺应节令时序，端午制曲不误一时，重阳下沙不省一工，于寒来暑往的专注中雕琢工序细节，在日复一日的坚守中夯实品质基础。[[创新驱动提质效]]。坚持守正创新，加速推动生产标准化落地、数字化迭代、智能化升级，让古老技艺焕发时代光彩，让传统酿造插上科技翅膀，持续拓宽习酒“优质优产”特色生产道路。[[人才赋能筑高地]]。统筹人才储备库建设，搭建人才成长平台，以慧眼识才选贤任能，以雅量容才聚智聚力，让各类人才在习酒干事有舞台、成长有空间、发展有未来，实现企业与员工发展共进、价值共创、成果共享。[[文化聚力践初心]]。将君品文化融入岗位实践，心怀善念、行有善举，在平凡岗位上履职尽责、在急难险重任务前挺身而出，把个人奋斗融入企业发展大局，彰显习酒人向上向善的精神风貌。' },
        // 诗句1
        { text: '[[一路霜雪皆成酿，半卷光阴自带香]]' },
        // 排比段
        { text: '回望来路，[[是你们]]，以信仰为灯，将红色基因融入血脉，让先锋旗帜在各条战线高高飘扬；[[是你们]]，以匠心为尺，将严谨贯穿每道工序，让佳酿在岁月窖藏中愈显醇香；[[是你们]]，以创新为翼，将智慧融入工艺攻关，让品质在技术突破中稳步提升；[[是你们]]，以笃学为梯，将钻研融入岗位日常，让技艺在千锤百炼中绽放光彩；[[是你们]]，以善念为怀，将温情浸润细微之处，让君品文化在润物无声中根植人心。在此，向每一位奋力拼搏的习酒人，致以崇高的敬意！' },
        // 诗句2
        { text: '[[枸酱千年留味在，习酒今朝启新程]]' },
        // 展望段
        { text: '展望未来，[[让我们]]，“跬步不休，千里可至”的韧劲，在生产工作中提质增效、创新突破，奏响生产新乐章；[[让我们]]，“毫厘必较，微瑕不放”的较真，在质量管控上精雕细刻、追求卓越，擦亮质量硬招牌；[[让我们]]，“同舟共济，众篙齐撑”的合力，在全局任务中主动补位、勇挑重担，为“东方习酒、享誉全球”的壮阔图景持续发力！' },
        // 结尾
        { text: '过去一年，感谢大家的辛勤奉献。' },
        { text: '新的一年，让我们同心聚力，携手共创习酒更加辉煌的明天！' },
        // 落款
        { text: '贵州习酒股份有限公司', noIndent: true, alignRight: true },
        { text: '2026年10月9日', noIndent: true, alignRight: true }
    ];

    const container = document.getElementById('letterContent');
    container.innerHTML = '';

    const paragraphElements = [];
    paragraphs.forEach(p => {
        const div = document.createElement('div');
        div.className = 'paragraph';
        if (p.noIndent) div.style.textIndent = '0';
        if (p.alignRight) div.style.textAlign = 'right';
        container.appendChild(div);
        paragraphElements.push(div);
    });

    // 解析 [[加粗文字]] 标记
    function parseParagraph(text) {
        const chars = [];
        let i = 0;
        let isBold = false;
        while (i < text.length) {
            if (text.substring(i, i + 2) === '[[') {
                isBold = true;
                i += 2;
                continue;
            }
            if (text.substring(i, i + 2) === ']]') {
                isBold = false;
                i += 2;
                continue;
            }
            chars.push({ char: text[i], bold: isBold });
            i++;
        }
        return chars;
    }

    const queue = [];
    paragraphs.forEach((p, pi) => {
        const chars = parseParagraph(p.text);
        chars.forEach(c => {
            queue.push({
                char: c.char,
                bold: c.bold,
                paragraphIndex: pi
            });
        });
    });

    const total = queue.length;
    const TARGET_TIME = 8000;
    const baseDelay = Math.max(4, Math.floor(TARGET_TIME / total));

    let idx = 0;
    let cursorSpan = null;

    function removeCursor() {
        if (cursorSpan && cursorSpan.parentNode) {
            cursorSpan.parentNode.removeChild(cursorSpan);
        }
        cursorSpan = null;
    }

    function typeNext() {
        if (idx >= total) {
            removeCursor();
            return;
        }

        const item = queue[idx];
        const span = document.createElement('span');
        span.className = 'char ' + (item.bold ? 'bold' : 'white');
        span.textContent = item.char;
        span.style.animationDuration = '0.05s';

        const paraEl = paragraphElements[item.paragraphIndex];
        paraEl.appendChild(span);

        removeCursor();
        cursorSpan = document.createElement('span');
        cursorSpan.className = 'cursor';
        paraEl.appendChild(cursorSpan);

        idx++;

        if (idx < total) {
            let delay = baseDelay;
            const nextCh = queue[idx].char;
            if (['，', '。', '；', '！', '？', '、', '：'].includes(nextCh)) {
                delay += 2;
            }
            setTimeout(typeNext, delay);
        } else {
            setTimeout(removeCursor, 120);
        }
    }

    setTimeout(typeNext, 200);
})();
</script>
</body>
</html>
